# -- Deploy Argo CD Applications within this helm release
applications:
 - name: boutique
   namespace: argocd
   project: default
   source:
     repoURL: placeholder
     targetRevision: HEAD
     path: boutique/boutique
     directory:
       recurse: true
   destination:
     server: https://kubernetes.default.svc
     namespace: boutique
   syncPolicy:
     automated:
       prune: false
       selfHeal: false
   revisionHistoryLimit: null
   ignoreDifferences:
   - group: apps
     kind: Deployment
     jsonPointers:
     - /spec/replicas
